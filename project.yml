name: EggClock
options:
  bundleIdPrefix: com.xinyu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EggClock:
    type: application
    platform: iOS
    sources:
      - path: "Xinyu's EggClock"
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "EggClockWidget"
          - "EggClockWidget/**"
    settings:
      base:
        INFOPLIST_FILE: "Xinyu's EggClock/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.xinyu.eggclock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: JG859Y62DP
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: EggClockWidget
        embed: true

  EggClockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: "Xinyu's EggClock/EggClockWidget"
      - path: "Xinyu's EggClock/Shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xinyu.eggclock.widget
        INFOPLIST_FILE: "Xinyu's EggClock/EggClockWidget/Info.plist"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JG859Y62DP
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  EggClock:
    build:
      targets:
        EggClock: all
        EggClockWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release